  const ALL_DROPS = [DROPS_JMY, DROPS_CONTRACT, DROPS_SCHEDULE].concat(DROPS);

  const TAB_DROP = {};
  ALL_DROPS.forEach(d => d.items.forEach(it => { TAB_DROP[it.id] = d.group; }));

  const frame = document.getElementById("main-frame");
  const placeholder = document.getElementById("main-placeholder");
  const refsList = document.getElementById("refs-list");
  const refPreview = document.getElementById("ref-preview");
  const rightPane = document.querySelector(".pane.right");
  const mainTag = document.getElementById("main-tag");
  const refTag = document.getElementById("ref-tag");
  const tabBtns = document.querySelectorAll(".tab[data-tab]");
  const dropNav = document.getElementById("drop-nav");
  const paneLeft = document.querySelector(".pane.left");
  const paneRight = document.querySelector(".pane.right");
  const paneSwitchBtns = document.querySelectorAll(".pane-switch-btn");
  const switchMainLabel = document.getElementById("switch-main-label");
  const switchRefLabel = document.getElementById("switch-ref-label");

  let activePane = "left";
  let _printFrameHeight = "";
  let _mouseX = window.innerWidth / 2;
  let _mouseY = window.innerHeight / 2;

  document.addEventListener("mousemove", e => {
    _mouseX = e.clientX;
    _mouseY = e.clientY;
  }, { passive: true });

  function syncIframeMouseTrack() {
    try {
      const doc = frame.contentDocument;
      if (!doc || doc._portalMouseTrack) return;
      doc._portalMouseTrack = true;
      doc.addEventListener("mousemove", e => {
        const r = frame.getBoundingClientRect();
        _mouseX = r.left + e.clientX;
        _mouseY = r.top + e.clientY;
      }, { passive: true });
    } catch (_) { /* cross-origin */ }
  }

  /** iframe 본문의 PDF·HWP·MD·xlsx 링크 — 우측 미리보기 또는 즉시 저장 */
  function pathFromAbsUrl(absUrl) {
    let p = decodeURIComponent(new URL(absUrl, location.href).pathname.replace(/^\//, ""));
    return p;
  }

  function triggerFileDownload(absUrl, filename) {
    fetch(absUrl)
      .then(r => {
        if (!r.ok) throw new Error(String(r.status));
        return r.blob();
      })
      .then(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename || "download";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      })
      .catch(() => window.open(absUrl, "_blank", "noopener"));
  }

  function mountPdfViewer(container, encPath, label) {
    container.hidden = false;
    if (rightPane) rightPane.classList.add("ref-preview-open");
    container.innerHTML =
      '<div class="ref-card" style="height:100%;display:flex;flex-direction:column;margin:0;border:none;box-shadow:none">' +
      '<h3 style="flex:0 0 auto">' + label + '</h3>' +
      '<div class="body" style="flex:1 1 0;min-height:0;padding:0;display:flex;flex-direction:column">' +
      '<iframe class="embed-pdf" style="flex:1 1 0;min-height:280px;margin:0" src="' +
      encPath + '#view=FitH" title="' + label + '"></iframe></div></div>';
  }

  function bindIframeFileLinks() {
    try {
      const doc = frame.contentDocument;
      if (!doc || doc._portalFileLinks) return;
      doc._portalFileLinks = true;
      doc.addEventListener("click", e => {
        const a = e.target.closest ? e.target.closest("a[href]") : null;
        if (!a) return;
        const href = a.getAttribute("href") || "";
        if (!href || href.startsWith("#")) return;
        if (/^https?:\/\//i.test(href)) {
          try {
            const u = new URL(href);
            if (u.origin !== location.origin) return;
          } catch (_) { return; }
        }
        const absUrl = new URL(href, doc.baseURI || frame.src).href;
        const relEnc = enc(pathFromAbsUrl(absUrl));
        const label = (a.textContent || "").trim();
        const baseName = decodeURIComponent(pathFromAbsUrl(absUrl).split("/").pop() || "download");
        if (/\.md(\?|#|$)/i.test(href)) {
          e.preventDefault();
          openRefPreview(relEnc, label, "md");
        } else if (/\.pdf(\?|#|$)/i.test(href)) {
          e.preventDefault();
          if (e.altKey) {
            triggerFileDownload(absUrl, a.getAttribute("download") || baseName);
          } else {
            setActivePane("right");
            refPreview.hidden = false;
            if (rightPane) rightPane.classList.add("ref-preview-open");
            mountPdfViewer(refPreview, relEnc, label);
          }
        } else if (/\.(hwp|hwpx)(\?|#|$)/i.test(href)) {
          e.preventDefault();
          triggerFileDownload(absUrl, a.getAttribute("download") || baseName);
        } else if (/\.xls[xm]?(\?|#|$)/i.test(href)) {
          e.preventDefault();
          openRefPreview(relEnc, label, "xlsx");
        }
      });
    } catch (_) { /* cross-origin */ }
  }

  /** Ctrl+P 시점 마우스 위치 → 인쇄 대상(좌·우·근거 미리보기) */
  function resolvePrintTarget() {
    if (document.activeElement === frame) {
      return { pane: "left", refArea: null };
    }
    if (frame && !frame.hidden) {
      const r = frame.getBoundingClientRect();
      if (_mouseX >= r.left && _mouseX <= r.right && _mouseY >= r.top && _mouseY <= r.bottom) {
        return { pane: "left", refArea: null };
      }
    }
    const el = document.elementFromPoint(_mouseX, _mouseY);
    if (el && paneRight && paneRight.contains(el)) {
      let refArea = null;
      if (refsList && refsList.contains(el)) refArea = "list";
      else if (refPreview && refPreview.contains(el)) refArea = "preview";
      else if (refPreview && !refPreview.hidden) refArea = "preview";
      return { pane: "right", refArea };
    }
    if (el && paneLeft && paneLeft.contains(el)) {
      return { pane: "left", refArea: null };
    }
    return {
      pane: activePane,
      refArea: activePane === "right" && refPreview && !refPreview.hidden ? "preview" : null,
    };
  }

  function applyPrintScope(pane, refArea) {
    const p = pane === "right" ? "right" : "left";
    document.body.classList.remove(
      "print-scope-left", "print-scope-right", "print-ref-preview", "print-ref-list-only"
    );
    document.body.classList.add(p === "right" ? "print-scope-right" : "print-scope-left");
    if (p === "right") {
      if (refArea === "list") {
        if (refPreview && !refPreview.hidden) {
          document.body.classList.add("print-ref-list-only");
        }
      } else if (refArea === "preview" || (refPreview && !refPreview.hidden)) {
        document.body.classList.add("print-ref-preview");
      }
    }
    if (p === "left" && !frame.hidden) {
      try {
        const doc = frame.contentDocument;
        const root = doc.documentElement;
        const h = Math.max(
          root.scrollHeight, root.offsetHeight,
          doc.body.scrollHeight, doc.body.offsetHeight
        );
        _printFrameHeight = frame.style.height;
        frame.style.height = Math.max(h, 400) + "px";
        frame.contentWindow.scrollTo(0, 0);
      } catch (_) { /* iframe 미로드 */ }
    }
  }

  function clearPrintScope() {
    document.body.classList.remove(
      "print-scope-left", "print-scope-right", "print-ref-preview", "print-ref-list-only"
    );
    if (_printFrameHeight !== undefined) {
      frame.style.height = _printFrameHeight;
      _printFrameHeight = "";
    }
  }

  function canPrintLeftIframe() {
    return frame && !frame.hidden && frame.contentWindow;
  }

  /** 좌측 iframe 본문(건설업 안내 등) — iframe 문서 자체를 인쇄 */
  function printLeftIframe() {
    try {
      const win = frame.contentWindow;
      if (!win) return false;
      try { win.focus(); } catch (_) {}
      win.print();
      return true;
    } catch (_) {
      return false;
    }
  }

  function bindIframePrint() {
    try {
      const win = frame.contentWindow;
      if (!win) return;
      if (win._portalPrintHandler) {
        win.removeEventListener("keydown", win._portalPrintHandler, true);
      }
      win._portalPrintHandler = e => {
        if (!(e.ctrlKey || e.metaKey) || (e.key !== "p" && e.key !== "P")) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        setActivePane("left");
        if (!printLeftIframe()) printAtMouse({ forcePane: "left", useParentPrint: true });
      };
      win.addEventListener("keydown", win._portalPrintHandler, true);
    } catch (_) { /* cross-origin */ }
  }

  function printAtMouse(opts) {
    const forced = opts && opts.forcePane;
    const { pane, refArea } = forced
      ? { pane: forced, refArea: (opts.refArea != null ? opts.refArea : null) }
      : resolvePrintTarget();
    setActivePane(pane);
    if (pane === "left" && canPrintLeftIframe() && !(opts && opts.useParentPrint)) {
      printLeftIframe();
      return;
    }
    applyPrintScope(pane, refArea);
    window.print();
  }
  function syncPaneSwitchLabels() {
    if (switchMainLabel) switchMainLabel.textContent = mainTag.textContent || "본문";
    if (switchRefLabel) switchRefLabel.textContent = refTag.textContent || "근거자료";
  }

  function setMobileViewPane(pane) {
    const p = pane === "right" ? "right" : "left";
    document.body.dataset.viewPane = p;
    paneSwitchBtns.forEach(btn => {
      const on = btn.dataset.pane === p;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
    });
  }

  function setActivePane(pane) {
    activePane = pane === "right" ? "right" : "left";
    if (paneLeft) paneLeft.classList.toggle("pane-focused", activePane === "left");
    if (paneRight) paneRight.classList.toggle("pane-focused", activePane === "right");
    setMobileViewPane(activePane);
  }

  [paneLeft, paneRight].forEach(el => {
    if (!el) return;
    el.addEventListener("pointerdown", () => setActivePane(el === paneRight ? "right" : "left"));
    el.addEventListener("focusin", () => setActivePane(el === paneRight ? "right" : "left"));
  });
  paneSwitchBtns.forEach(btn => {
    btn.addEventListener("click", () => setActivePane(btn.dataset.pane));
  });
  setActivePane("left");

  document.addEventListener("keydown", e => {
    if (!(e.ctrlKey || e.metaKey) || (e.key !== "p" && e.key !== "P")) return;
    e.preventDefault();
    printAtMouse();
  }, true);

  window.addEventListener("beforeprint", () => {
    if (!document.body.classList.contains("print-scope-left") &&
        !document.body.classList.contains("print-scope-right")) {
      const t = resolvePrintTarget();
      applyPrintScope(t.pane, t.refArea);
    }
  });
  window.addEventListener("afterprint", clearPrintScope);

  frame.addEventListener("load", () => {
    syncIframeMouseTrack();
    bindIframeFileLinks();
    bindIframePrint();
  });
  if (frame.contentDocument && frame.contentDocument.readyState === "complete") {
    syncIframeMouseTrack();
    bindIframeFileLinks();
    bindIframePrint();
  }

  function closeAllDrops() {
    document.querySelectorAll(".tab-drop.open").forEach(el => {
      el.classList.remove("open");
      el.querySelector(".tab-drop-btn").setAttribute("aria-expanded", "false");
    });
  }

  function updateDrops(activeId) {
    ALL_DROPS.forEach(d => {
      const nav = document.getElementById(d.navId || "drop-nav");
      if (!nav) return;
      const wrap = nav.querySelector('[data-drop="' + d.group + '"]');
      if (!wrap) return;
      const active = TAB_DROP[activeId] === d.group;
      wrap.classList.toggle("active", active);
      const item = d.items.find(x => x.id === activeId);
      wrap.querySelector(".tab-drop-label").textContent = active && item ? item.menu : d.label;
      wrap.querySelectorAll(".tab-drop-item").forEach(el => {
        el.classList.toggle("active", el.dataset.tab === activeId);
      });
    });
  }

  function showLeftPane(mode) {
    /* mode: "iframe" | "placeholder" */
    if (mode === "iframe") {
      frame.hidden = false;
      placeholder.hidden = true;
      placeholder.innerHTML = "";
    } else {
      frame.hidden = true;
      placeholder.hidden = false;
    }
  }

  function switchTab(id) {
    const cfg = TABS[id];
    if (!cfg) return;
    tabBtns.forEach(btn => {
      const on = btn.dataset.tab === id;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
    });
    closeAllDrops();
    updateDrops(id);
    if (cfg.placeholder) {
      showLeftPane("placeholder");
      placeholder.innerHTML = cfg.placeholder;
    } else if (cfg.main && /\.md(\?|#|$)/i.test(cfg.main)) {
      showLeftPane("placeholder");
      renderMdUrl(enc(cfg.main), cfg.label);
    } else if (cfg.main) {
      showLeftPane("iframe");
      frame.src = encMain(cfg.main);
    } else {
      showLeftPane("placeholder");
      placeholder.innerHTML = viewerNote(cfg.label, "본문 경로가 없습니다.");
    }
    mainTag.textContent = cfg.label;
    refTag.textContent = cfg.refTag;
    syncPaneSwitchLabels();
    refsList.innerHTML = cfg.refs;
    clearRefPreview();
    const xlsxLinks = refsList.querySelectorAll("a.ref-open-xlsx");
    if (xlsxLinks.length === 1) {
      const a = xlsxLinks[0];
      openRefPreview(a.getAttribute("href"), (a.textContent || "").trim(), "xlsx");
    } else {
      setActivePane("left");
    }
    location.hash = id;
  }

  function clearRefPreview() {
    refPreview.hidden = true;
    refPreview.innerHTML = "";
    if (rightPane) rightPane.classList.remove("ref-preview-open");
    refsList.querySelectorAll("a.ref-active").forEach(a => a.classList.remove("ref-active"));
  }

  function markRefActive(href) {
    refsList.querySelectorAll("a.ref-open-xlsx, a.ref-open-md, a.ref-open-html").forEach(a => {
      a.classList.toggle("ref-active", a.getAttribute("href") === href);
    });
  }

  function openRefPreview(encPath, label, kind) {
    setActivePane("right");
    refPreview.hidden = false;
    if (rightPane) rightPane.classList.add("ref-preview-open");
    markRefActive(encPath);
    if (kind === "md") mountMdViewer(refPreview, encPath, label);
    else if (kind === "html") mountHtmlViewer(refPreview, encPath, label);
    else mountXlsxViewer(refPreview, encPath, label);
  }

  refsList.addEventListener("click", e => {
    const a = e.target.closest ? e.target.closest("a.ref-open-xlsx, a.ref-open-md, a.ref-open-html, a.ref-open-pdf, a.ref-open-dl") : null;
    if (!a) return;
    e.preventDefault();
    const href = a.getAttribute("href") || "";
    const label = (a.textContent || "").trim();
    if (/\.html(\?|#|$)/i.test(href)) openRefPreview(href, label, "html");
    else if (/\.xls[xm]?(\?|#|$)/i.test(href)) openRefPreview(href, label, "xlsx");
    else if (/\.md(\?|#|$)/i.test(href)) openRefPreview(href, label, "md");
    else if (/\.pdf(\?|#|$)/i.test(href)) {
      setActivePane("right");
      refPreview.hidden = false;
      if (rightPane) rightPane.classList.add("ref-preview-open");
      const pdfPath = href.startsWith("/") ? enc(href.slice(1)) : enc(href);
      mountPdfViewer(refPreview, pdfPath, label);
    } else if (/\.(hwp|hwpx)(\?|#|$)/i.test(href)) {
      const absUrl = new URL(href, location.href).href;
      triggerFileDownload(absUrl, a.getAttribute("download") || label);
    }
  });

  function buildDropNav(containerEl, drops) {
    drops.forEach(d => {
      const wrap = document.createElement("div");
      wrap.className = "tab-drop";
      wrap.dataset.drop = d.group;
      wrap.innerHTML =
        '<button type="button" class="tab tab-drop-btn" aria-haspopup="true" aria-expanded="false">' +
        '<span class="tab-drop-label">' + d.label + '</span> <span class="caret">▾</span></button>' +
        '<div class="tab-drop-menu" role="menu">' +
        d.items.map(it =>
          '<button type="button" class="tab-drop-item" data-tab="' + it.id + '" role="menuitem">' + it.menu + "</button>"
        ).join("") +
        "</div>";
      containerEl.appendChild(wrap);
      wrap.querySelector(".tab-drop-btn").addEventListener("click", e => {
        e.stopPropagation();
        const wasOpen = wrap.classList.contains("open");
        switchTab(d.items[0].id);
        if (!wasOpen) {
          wrap.classList.add("open");
          wrap.querySelector(".tab-drop-btn").setAttribute("aria-expanded", "true");
        }
      });
      wrap.querySelectorAll(".tab-drop-item").forEach(item => {
        item.addEventListener("click", () => switchTab(item.dataset.tab));
      });
    });
  }

  let _xlsxCtx = { root: null, wb: null };
  function _xlsxRenderSheet(name) {
    const root = _xlsxCtx.root;
    if (!root) return;
    const body = root.querySelector(".xlsx-body");
    root.querySelectorAll(".xlsx-tabs button").forEach(b =>
      b.classList.toggle("active", b.dataset.sheet === name));
    if (!_xlsxCtx.wb || !body) return;
    body.innerHTML = XLSX.utils.sheet_to_html(_xlsxCtx.wb.Sheets[name], { editable: false });
  }
  function _xlsxRenderWorkbook(buf) {
    _xlsxCtx.wb = XLSX.read(buf, { type: "array" });
    const root = _xlsxCtx.root;
    const names = _xlsxCtx.wb.SheetNames;
    const st = root.querySelector(".xlsx-status");
    if (st) st.textContent = names.length + "개 시트";
    const tabs = root.querySelector(".xlsx-tabs");
    tabs.innerHTML = names.map(n =>
      '<button type="button" data-sheet="' + n.replace(/"/g, "&quot;") + '">' + n + "</button>").join("");
    tabs.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => _xlsxRenderSheet(b.dataset.sheet)));
    _xlsxRenderSheet(names[0]);
  }
  function _renderMdText(container, txt, encPath) {
    let body = container.querySelector(".md-body");
    if (!body) {
      container.innerHTML = '<div class="md-body"></div>';
      body = container.querySelector(".md-body");
    }
    const base = encPath.slice(0, encPath.lastIndexOf("/") + 1);
    if (typeof marked === "undefined") {
      body.innerHTML = "<pre>" + txt.replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;") + "</pre>";
      return;
    }
    body.innerHTML = marked.parse(txt);
    body.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute("href") || "";
      if (!/^([a-z]+:|\/|#)/i.test(h)) a.setAttribute("href", base + h);
      if (/^https?:/i.test(a.getAttribute("href"))) a.setAttribute("target", "_blank");
    });
  }

  function _mdFilePicker(container, encPath, label) {
    const suggested = decodeURIComponent((encPath.split("/").pop() || "").split("?")[0]);
    const name = label || suggested.replace(/\.md$/i, "");
    container.innerHTML =
      '<div class="xlsx-fallback"><h3>' + name + " — 요약.md</h3>" +
      "<p>로컬 파일(<code>file://</code>)에서는 md 자동 읽기가 차단됩니다. " +
      "아래 <b>파일 선택</b>으로 <code>" + suggested + "</code>를 고르면 본문 미리보기가 열립니다.</p>" +
      '<p class="muted">경로 예: <code>05_내역서/내역서작업/토목/' + suggested + "</code></p>" +
      '<div class="pick"><input type="file" accept=".md,text/markdown"></div></div>' +
      '<div class="md-body" hidden></div>';
    const inp = container.querySelector("input[type=file]");
    inp.addEventListener("change", e => {
      const f = e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = ev => {
        container.querySelector(".xlsx-fallback").hidden = true;
        const md = container.querySelector(".md-body");
        md.hidden = false;
        _renderMdText(container, ev.target.result, encPath);
      };
      rd.readAsText(f, "UTF-8");
    });
  }

  function _xlsxFallback(encPath) {
    const root = _xlsxCtx.root;
    if (!root) return;
    const st = root.querySelector(".xlsx-status");
    const body = root.querySelector(".xlsx-body");
    if (st) st.textContent = "자동 미리보기 불가";
    if (!body) return;
    const suggested = decodeURIComponent((encPath.split("/").pop() || "").split("?")[0]);
    body.innerHTML =
      '<div class="xlsx-fallback"><h3>브라우저 보안으로 자동 읽기가 차단되었습니다</h3>' +
      "<p>로컬 파일(<code>file://</code>)에서는 Chrome·Edge가 xlsx 자동 읽기를 막습니다. " +
      "아래 <b>파일 선택</b>으로 <code>" + suggested + "</code>를 고르면 표 미리보기가 열립니다(저장 창 없음).</p>" +
      '<div class="pick"><input type="file" accept=".xls,.xlsx,.xlsm"></div></div>';
    const inp = body.querySelector("input[type=file]");
    inp.addEventListener("change", e => {
      const f = e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = ev => {
        try {
          _xlsxRenderWorkbook(new Uint8Array(ev.target.result));
          if (st) st.textContent = f.name + " · " + _xlsxCtx.wb.SheetNames.length + "개 시트";
        } catch (x) {
          body.innerHTML = '<div class="xlsx-fallback">읽기 실패: ' + x + "</div>";
        }
      };
      rd.readAsArrayBuffer(f);
    });
  }
  function mountXlsxViewer(container, encPath, label) {
    _xlsxCtx.root = container;
    _xlsxCtx.wb = null;
    const name = label || decodeURIComponent(encPath.split("/").pop());
    container.innerHTML =
      '<div class="xlsx-wrap"><div class="xlsx-head"><strong>' + name + "</strong>" +
      '<span class="xlsx-status">불러오는 중…</span></div>' +
      '<div class="xlsx-tabs"></div><div class="xlsx-body"></div></div>';
    if (typeof XLSX === "undefined") { _xlsxFallback(encPath); return; }
    if (IS_FILE_PROTO) { _xlsxFallback(encPath); return; }
    fetch(encPath)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(buf => _xlsxRenderWorkbook(buf))
      .catch(() => _xlsxFallback(encPath));
  }
  function renderXlsxUrl(encPath, label) {
    showLeftPane("placeholder");
    mountXlsxViewer(placeholder, encPath, label);
  }

  function mountMdViewer(container, encPath, label) {
    const name = label || decodeURIComponent(encPath.split("/").pop());
    if (IS_FILE_PROTO) {
      _mdFilePicker(container, encPath, label || name);
      return;
    }
    container.innerHTML = '<div class="md-body">불러오는 중…</div>';
    const body = container.querySelector(".md-body");
    fetch(encPath)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(txt => _renderMdText(container, txt, encPath))
      .catch(() => _mdFilePicker(container, encPath, label || name));
  }
  function _injectHtmlDoc(container, html, encPath) {
    const base = encPath.replace(/[#?].*$/, "").slice(0, encPath.replace(/[#?].*$/, "").lastIndexOf("/") + 1);
    container.innerHTML = '<div class="html-body"></div>';
    const host = container.querySelector(".html-body");
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("style").forEach(s => host.appendChild(s.cloneNode(true)));
    doc.querySelectorAll('link[rel="stylesheet"]').forEach(l => {
      const link = l.cloneNode(true);
      const href = link.getAttribute("href") || "";
      if (href && !/^([a-z]+:|\/|#)/i.test(href)) link.setAttribute("href", base + href);
      host.appendChild(link);
    });
    host.insertAdjacentHTML("beforeend", doc.body ? doc.body.innerHTML : html);
  }
  function _htmlFilePicker(container, encPath, label) {
    const suggested = decodeURIComponent((encPath.replace(/[#?].*$/, "").split("/").pop() || ""));
    const name = label || suggested.replace(/\.html$/i, "");
    container.innerHTML =
      '<div class="xlsx-fallback"><h3>' + name + '</h3>' +
      '<p>로컬 파일(<code>file://</code>)에서는 HTML 자동 읽기가 차단될 수 있습니다. ' +
      '아래 <b>파일 선택</b>으로 <code>' + suggested + '</code>를 고르거나 iframe으로 열어보세요.</p>' +
      '<p class="muted">경로: <code>' + encPath.replace(/[#?].*$/, "") + '</code></p>' +
      '<div class="pick"><input type="file" accept=".html,text/html"></div></div>' +
      '<iframe class="html-embed" title="' + name + '" src="' + enc(encPath.replace(/[#?].*$/, "")) + '"></iframe>';
    const inp = container.querySelector("input[type=file]");
    inp.addEventListener("change", e => {
      const f = e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = ev => {
        container.querySelector(".xlsx-fallback").hidden = true;
        const emb = container.querySelector(".html-embed");
        if (emb) emb.hidden = true;
        _injectHtmlDoc(container, ev.target.result, encPath);
      };
      rd.readAsText(f, "UTF-8");
    });
  }
  function mountHtmlViewer(container, encPath, label) {
    const path = encPath.replace(/[#?].*$/, "");
    const name = label || decodeURIComponent(path.split("/").pop() || "");
    if (IS_FILE_PROTO) {
      container.innerHTML = '<iframe class="html-embed" title="' + name + '" src="' + enc(path) + '"></iframe>';
      return;
    }
    container.innerHTML = '<div class="html-body">불러오는 중…</div>';
    fetch(path)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(html => _injectHtmlDoc(container, html, path))
      .catch(() => _htmlFilePicker(container, encPath, label || name));
  }
  function renderMdUrl(encPath, label) {
    showLeftPane("placeholder");
    mountMdViewer(placeholder, encPath, label);
  }
  function renderHtmlUrl(encPath, label) {
    showLeftPane("placeholder");
    mountHtmlViewer(placeholder, encPath, label);
  }

  /* 본문(좌) 안의 md/xlsx 링크만 좌측 미리보기 — 우측 근거자료 링크는 target=_blank 유지 */
  placeholder.addEventListener("click", e => {
    const a = e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || a.hasAttribute("download") || a.classList.contains("xlsx-dl")) return;
    const href = a.getAttribute("href") || "";
    const label = (a.textContent || "").trim();
    if (/\.html(\?|#|$)/i.test(href)) {
      e.preventDefault();
      renderHtmlUrl(href, label);
    } else if (/\.xls[xm]?(\?|#|$)/i.test(href)) {
      e.preventDefault();
      renderXlsxUrl(href, label);
    } else if (/\.md(\?|#|$)/i.test(href)) {
      e.preventDefault();
      renderMdUrl(href, label);
    }
  });

  tabBtns.forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
  document.addEventListener("click", closeAllDrops);
  buildDropNav(document.getElementById("drop-nav-jmy"), [DROPS_JMY]);
  buildDropNav(document.getElementById("drop-nav-contract"), [DROPS_CONTRACT]);
  buildDropNav(document.getElementById("drop-nav-schedule"), [DROPS_SCHEDULE]);
  buildDropNav(dropNav, DROPS);

  if (IS_FILE_PROTO) {
    const banner = document.getElementById("file-banner");
    if (banner) banner.hidden = false;
  }

  const HASH_ALIAS = { "um-review": "um-ka", "um-review-il": "um-ka" };
  let hash = HASH_ALIAS[location.hash.replace("#", "")] || location.hash.replace("#", "");
  if (!TABS[hash] && /^(um-|rv-)/.test(hash)) hash = "um-ka";
  if (TABS[hash]) switchTab(hash);
  else switchTab("jinmyeong");
})();
</script>
</body>
